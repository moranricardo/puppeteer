<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg-main: #ffffff;
        --border-color: #333333;
        --text-color: #000000;
        --box-puppeteer: #d9ead3;
        --box-browser: #fff2cc;
        --box-context: #fce5cd;
        --box-page: #d0e0e3;
        --box-frame: #ead1dc;
        --box-exec: #e1d5e7;
        --shadow: rgba(0, 0, 0, 0.05);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main: #1e1e1e;
          --border-color: #cccccc;
          --text-color: #ffffff;
          --box-puppeteer: #2d4a2d;
          --box-browser: #4a422d;
          --box-context: #4a352d;
          --box-page: #2d3e4a;
          --box-frame: #4a2d3e;
          --box-exec: #3d2d4a;
          --shadow: rgba(0, 0, 0, 0.3);
        }
      }

      rect {
        stroke: var(--border-color);
        stroke-width: 2;
        rx: 8;
        ry: 8;
        filter: drop-shadow(2px 4px 6px var(--shadow));
      }

      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: var(--text-color);
        font-size: 16px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .title {
        font-size: 20px;
        font-weight: bold;
      }

      path {
        stroke: var(--border-color);
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 4,4;
      }

      .arrow {
        fill: var(--border-color);
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow" />
    </marker>
  </defs>

  <!-- 1. Puppeteer (Contenedor Raíz) -->
  <rect x="20" y="20" width="960" height="740" fill="var(--box-puppeteer)" />
  <text x="70" y="45" class="title">Puppeteer</text>

  <!-- 2. Browser -->
  <rect x="50" y="70" width="900" height="660" fill="var(--box-browser)" />
  <text x="100" y="95" class="title">Browser</text>

  <!-- 3. BrowserContext (Default y Adicional) -->
  <g>
    <!-- Default BrowserContext -->
    <rect x="80" y="120" width="410" height="580" fill="var(--box-context)" />
    <text x="200" y="145" class="title">BrowserContext (Default)</text>

    <!-- Page 1 en Default Context -->
    <rect x="100" y="170" width="370" height="500" fill="var(--box-page)" />
    <text x="140" y="195" class="title">Page</text>

    <!-- Frame 1.1 -->
    <rect x="120" y="220" width="330" height="200" fill="var(--box-frame)" />
    <text x="180" y="245" class="title">Frame (Main)</text>

    <rect x="140" y="270" width="290" height="130" fill="var(--box-exec)" />
    <text x="285" y="335">ExecutionContext</text>

    <!-- Frame 1.2 (Child) -->
    <rect x="120" y="440" width="330" height="200" fill="var(--box-frame)" />
    <text x="180" y="465" class="title">Frame (Child)</text>

    <rect x="140" y="490" width="290" height="130" fill="var(--box-exec)" />
    <text x="285" y="555">ExecutionContext</text>
  </g>

  <g>
    <!-- Segundo BrowserContext -->
    <rect x="510" y="120" width="420" height="580" fill="var(--box-context)" />
    <text x="630" y="145" class="title">BrowserContext</text>

    <!-- Page 2 -->
    <rect x="530" y="170" width="380" height="500" fill="var(--box-page)" />
    <text x="570" y="195" class="title">Page</text>

    <!-- Frame 2.1 -->
    <rect x="550" y="220" width="340" height="420" fill="var(--box-frame)" />
    <text x="610" y="245" class="title">Frame (Main)</text>

    <rect x="570" y="280" width="300" height="160" fill="var(--box-exec)" />
    <text x="720" y="360">ExecutionContext (JS/DOM)</text>

    <rect x="570" y="460" width="300" height="150" fill="var(--box-exec)" />
    <text x="720" y="535">ExecutionContext (Isolated World)</text>
  </g>
</svg>
