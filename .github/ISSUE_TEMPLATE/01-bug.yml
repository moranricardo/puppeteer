name: Bug Report - Ciclo de Ra
description: Reportar un fallo o error en la ejecución del orquestador.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        ### Reporte de Error - Ciclo de Ra
        Por favor, describe el fallo detectado en el flujo de automatización.
  - id: description
    type: textarea
    attributes:
      label: Descripción del problema
      description: ¿Qué sucedió o qué fallo mostró el log de GitHub Actions / Termux?
      placeholder: |
        Ocurrió un error al ejecutar...
    validations:
      required: true
  - id: environment
    type: dropdown
    attributes:
      label: Entorno de Ejecución
      description: ¿Dónde ocurrió el error?
      options:
        - GitHub Actions (CI/CD)
        - Termux (Local)
        - DevContainer / VS Code
    validations:
      required: true
  - id: node-version
    type: input
    attributes:
      label: Versión de Node.js
      description: Versión de Node utilizada en la ejecución.
      placeholder: "v22.x / v24.x"
    validations:
      required: false
  - id: logs
    type: textarea
    attributes:
      label: Logs / Salida del error
      description: Pega aquí los mensajes de error relevantes.
      render: shell
